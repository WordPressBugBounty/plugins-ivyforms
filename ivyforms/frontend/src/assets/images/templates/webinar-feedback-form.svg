<svg viewBox="0 0 400 545" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #374151; }
      .label { font-size: 14px; }
      .title { font-size: 24px; font-weight: bold; }
      .required { fill: #dc2626; }
      .placeholder { fill: #9ca3af; }
    </style>
    <g id="star-outline">
      <path d="M9.15316 5.40838C10.4198 3.13613 11.0531 2 12 2C12.9469 2 13.5802 3.13612 14.8468 5.40837L15.1745 5.99623C15.5345 6.64193 15.7144 6.96479 15.9951 7.17781C16.2757 7.39083 16.6251 7.4699 17.3241 7.62805L17.9605 7.77203C20.4201 8.32856 21.65 8.60682 21.9426 9.54773C22.2352 10.4886 21.3968 11.4691 19.7199 13.4299L19.2861 13.9372C18.8096 14.4944 18.5713 14.773 18.4641 15.1177C18.357 15.4624 18.393 15.8341 18.465 16.5776L18.5306 17.2544C18.7841 19.8706 18.9109 21.1787 18.1449 21.7602C17.3788 22.3417 16.2273 21.8115 13.9243 20.7512L13.3285 20.4768C12.6741 20.1755 12.3469 20.0248 12 20.0248C11.6531 20.0248 11.3259 20.1755 10.6715 20.4768L10.0757 20.7512C7.77268 21.8115 6.62118 22.3417 5.85515 21.7602C5.08912 21.1787 5.21588 19.8706 5.4694 17.2544L5.53498 16.5776C5.60703 15.8341 5.64305 15.4624 5.53586 15.1177C5.42868 14.773 5.19043 14.4944 4.71392 13.9372L4.2801 13.4299C2.60325 11.4691 1.76482 10.4886 2.05742 9.54773C2.35002 8.60682 3.57986 8.32856 6.03954 7.77203L6.67589 7.62805C7.37485 7.4699 7.72433 7.39083 8.00494 7.17781C8.28555 6.96479 8.46553 6.64194 8.82547 5.99623L9.15316 5.40838Z" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
    </g>
    <clipPath id="viewport-clip">
      <rect x="0" y="0" width="400" height="550" />
    </clipPath>
  </defs>

  <rect width="400" height="550" fill="#ffffff"/>

  <g clip-path="url(#viewport-clip)">
    <text x="30" y="35" class="title">Webinar feedback form</text>

    <!-- Webinar platform (select) -->
    <text x="30" y="75" class="label" font-weight="700">Webinar platform<tspan dx="4" class="required">*</tspan></text>
    <rect x="30" y="80" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" rx="6"/>
    <text x="40" y="104" class="label placeholder">Select webinar platform...</text>
    <polygon points="355,102.5 360,107.5 365,102.5" fill="#9ca3af"/>

    <!-- Audio & video quality (stars) -->
    <text x="30" y="145" class="label" font-weight="700">Audio &amp; video quality<tspan dx="4" class="required">*</tspan></text>
    <g transform="translate(30, 155)">
      <use href="#star-outline" x="0" y="-5" width="24" height="24"/>
      <use href="#star-outline" x="30" y="-5" width="24" height="24"/>
      <use href="#star-outline" x="60" y="-5" width="24" height="24"/>
      <use href="#star-outline" x="90" y="-5" width="24" height="24"/>
    </g>

    <!-- Overall experience (stars) -->
    <text x="30" y="205" class="label" font-weight="700">Overall webinar experience<tspan dx="4" class="required">*</tspan></text>
    <g transform="translate(30, 215)">
      <use href="#star-outline" x="0" y="-5" width="24" height="24"/>
      <use href="#star-outline" x="30" y="-5" width="24" height="24"/>
      <use href="#star-outline" x="60" y="-5" width="24" height="24"/>
      <use href="#star-outline" x="90" y="-5" width="24" height="24"/>
      <use href="#star-outline" x="120" y="-5" width="24" height="24"/>
    </g>
    <!-- Content value (stars) -->
    <text x="30" y="265" class="label" font-weight="700">Content value<tspan dx="4" class="required">*</tspan></text>
    <g transform="translate(30, 275)">
      <use href="#star-outline" x="0" y="-5" width="24" height="24"/>
      <use href="#star-outline" x="30" y="-5" width="24" height="24"/>
      <use href="#star-outline" x="60" y="-5" width="24" height="24"/>
      <use href="#star-outline" x="90" y="-5" width="24" height="24"/>
      <use href="#star-outline" x="120" y="-5" width="24" height="24"/>
    </g>
    <!-- Technical issues (checkboxes) -->
    <text x="30" y="315" class="label" font-weight="700">Technical issues experienced</text>
    <rect x="30" y="325" width="16" height="16" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" rx="3"/>
    <text x="52" y="337" class="label">Audio issues</text>

    <rect x="30" y="349" width="16" height="16" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" rx="3"/>
    <text x="52" y="361" class="label">Video issues</text>

    <rect x="30" y="373" width="16" height="16" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" rx="3"/>
    <text x="52" y="385" class="label">Connectivity problems</text>

    <!-- Additional feedback -->
    <text x="30" y="415" class="label">Additional feedback</text>
    <rect x="30" y="420" width="340" height="50" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" rx="6"/>
    <text x="40" y="445" class="label placeholder">Share any additional feedback</text>
  </g>
</svg>
