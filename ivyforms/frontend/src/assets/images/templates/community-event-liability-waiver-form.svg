<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 905" width="400" height="905">
    <!-- Background -->
    <rect width="400" height="900" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" rx="8"/>

    <!-- Title -->
    <text x="30" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#374151">Community event liability</text>
    <text x="30" y="60" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#374151">waiver form</text>

    <!-- Full Name header -->
    <text x="30" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#374151">Full name</text>

    <!-- First Name label -->
    <text x="30" y="118" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">First name<tspan dx="4" fill="#dc2626">*</tspan></text>
    <rect x="30" y="128" width="160" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="151" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter your first name</text>

    <!-- Last Name label -->
    <text x="210" y="118" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Last name<tspan dx="4" fill="#dc2626">*</tspan></text>
    <rect x="210" y="128" width="160" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="220" y="151" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter your last name</text>

    <!-- Email Address -->
    <text x="30" y="198" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Email address</text>
    <rect x="30" y="208" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="231" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter your email address</text>

    <!-- Phone Number -->
    <text x="30" y="278" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Phone number</text>
    <rect x="30" y="288" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="311" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter your phone number</text>

    <!-- Event Type -->
    <text x="30" y="358" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Event type<tspan dx="4" fill="#dc2626">*</tspan></text>
    <rect x="30" y="368" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="391" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Festival, charity event, sports day, workshop, other</text>
    <path d="M 350 388 L 355 393 L 360 388" stroke="#9ca3af" fill="none" stroke-width="2"/>

    <!-- Acknowledgment of Risks -->
    <text x="30" y="438" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Acknowledgment of risks<tspan dx="4" fill="#dc2626">*</tspan></text>
    <rect x="30" y="448" width="340" height="80" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="471" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">I acknowledge that i understand and accept</text>
    <text x="40" y="491" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">the risks associated with participating in this</text>
    <text x="40" y="511" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">community event and release liability</text>

    <!-- Special Notes / Health Considerations -->
    <text x="30" y="558" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Special notes / health considerations</text>
    <rect x="30" y="568" width="340" height="80" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="591" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Any allergies, medical conditions, or special</text>
    <text x="40" y="611" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">requirements we should know about</text>
    <text x="40" y="631" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">(optional)</text>

    <!-- Event Date -->
    <text x="30" y="678" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Event date<tspan dx="4" fill="#dc2626">*</tspan></text>
    <rect x="30" y="688" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="711" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Select event date</text>
    <!-- Calendar icon -->
    <rect x="345" y="698" width="20" height="20" fill="none" stroke="#9ca3af" stroke-width="1.5" rx="2"/>
    <line x1="348" y1="698" x2="348" y2="703" stroke="#9ca3af" stroke-width="1.5"/>
    <line x1="362" y1="698" x2="362" y2="703" stroke="#9ca3af" stroke-width="1.5"/>
    <line x1="345" y1="705" x2="365" y2="705" stroke="#9ca3af" stroke-width="1.5"/>

    <!-- Participant Signature -->
    <text x="30" y="758" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Participant signature<tspan dx="4" fill="#dc2626">*</tspan></text>
    <rect x="30" y="768" width="340" height="100" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="791" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Draw your signature here</text>
    <!-- Signature icon/line -->
    <path d="M 50 820 Q 100 810, 150 820 T 250 810 Q 290 805, 330 815" stroke="#d1d5db" fill="none" stroke-width="2" stroke-linecap="round"/>

    <!-- Submit Button -->
    <rect x="30" y="898" width="340" height="45" fill="#6366f1" rx="6"/>
    <text x="200" y="925" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Submit</text>

</svg>
