<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 575" width="400" height="575">
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #374151; }
      .label { font-size: 14px; }
      .title { font-size: 24px; font-weight: bold; }
      .required { fill: #dc2626; }
      .placeholder { fill: #9ca3af; }
    </style>
    <g id="star-outline">
      <path d="M9.15316 5.40838C10.4198 3.13613 11.0531 2 12 2C12.9469 2 13.5802 3.13612 14.8468 5.40837L15.1745 5.99623C15.5345 6.64193 15.7144 6.96479 15.9951 7.17781C16.2757 7.39083 16.6251 7.4699 17.3241 7.62805L17.9605 7.77203C20.4201 8.32856 21.65 8.60682 21.9426 9.54773C22.2352 10.4886 21.3968 11.4691 19.7199 13.4299L19.2861 13.9372C18.8096 14.4944 18.5713 14.773 18.4641 15.1177C18.357 15.4624 18.393 15.8341 18.465 16.5776L18.5306 17.2544C18.7841 19.8706 18.9109 21.1787 18.1449 21.7602C17.3788 22.3417 16.2273 21.8115 13.9243 20.7512L13.3285 20.4768C12.6741 20.1755 12.3469 20.0248 12 20.0248C11.6531 20.0248 11.3259 20.1755 10.6715 20.4768L10.0757 20.7512C7.77268 21.8115 6.62118 22.3417 5.85515 21.7602C5.08912 21.1787 5.21588 19.8706 5.4694 17.2544L5.53498 16.5776C5.60703 15.8341 5.64305 15.4624 5.53586 15.1177C5.42868 14.773 5.19043 14.4944 4.71392 13.9372L4.2801 13.4299C2.60325 11.4691 1.76482 10.4886 2.05742 9.54773C2.35002 8.60682 3.57986 8.32856 6.03954 7.77203L6.67589 7.62805C7.37485 7.4699 7.72433 7.39083 8.00494 7.17781C8.28555 6.96479 8.46553 6.64194 8.82547 5.99623L9.15316 5.40838Z" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
    </g>
  </defs>
  
  <rect width="400" height="575" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="30" y="35" class="title">Technical interview feedback</text>
  <text x="30" y="60" class="title">form</text>
  
  <!-- Candidate Name or ID -->
  <text x="30" y="100" class="label" font-weight="700">
    Candidate name or ID
    <tspan dx="4" class="required">*</tspan>
  </text>
  <rect x="30" y="105" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <text x="40" y="129" class="label placeholder">Enter candidate name or ID</text>
  
  <!-- Overall Interview Outcome -->
  <text x="30" y="180" class="label" font-weight="700">
    Overall interview outcome
    <tspan dx="4" class="required">*</tspan>
  </text>
  <circle cx="38" cy="195" r="6" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="52" y="200" class="label">Very positive</text>
  <circle cx="38" cy="217" r="6" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="52" y="222" class="label">Mostly positive</text>
  <circle cx="38" cy="239" r="6" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="52" y="244" class="label">Neutral</text>
  <circle cx="38" cy="261" r="6" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="52" y="266" class="label">Mostly negative</text>
  <circle cx="38" cy="283" r="6" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="52" y="288" class="label">Very negative</text>
  
  <!-- Overall Candidate Fit Rating -->
  <text x="30" y="323" class="label" font-weight="700">
    Overall candidate fit
    <tspan dx="4" class="required">*</tspan>
  </text>
  <g transform="translate(30, 328)">
    <use href="#star-outline" x="0" y="0" width="24" height="24"/>
    <use href="#star-outline" x="30" y="0" width="24" height="24"/>
    <use href="#star-outline" x="60" y="0" width="24" height="24"/>
    <use href="#star-outline" x="90" y="0" width="24" height="24"/>
    <use href="#star-outline" x="120" y="0" width="24" height="24"/>
  </g>
  
  <!-- Key Areas Observed -->
  <text x="30" y="383" class="label" font-weight="700">Key areas observed</text>
  <rect x="30" y="393" width="16" height="16" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" rx="3"/>
  <text x="52" y="405" class="label">Communication</text>
  <rect x="220" y="393" width="16" height="16" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" rx="3"/>
  <text x="242" y="405" class="label">Problem-solving</text>
  <rect x="30" y="415" width="16" height="16" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" rx="3"/>
  <text x="52" y="427" class="label">Technical skills</text>
  <rect x="220" y="415" width="16" height="16" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" rx="3"/>
  <text x="242" y="427" class="label">Cultural fit</text>
  <rect x="30" y="437" width="16" height="16" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" rx="3"/>
  <text x="52" y="449" class="label">Professionalism</text>
  
  <!-- Key Observations -->
  <text x="30" y="484" class="label" font-weight="700">Key observations</text>
  <rect x="30" y="489" width="340" height="50" rx="4" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="40" y="517" class="label placeholder">Strengths, concerns, notable answers...</text>
  
  <!-- Recommendation -->
  <text x="30" y="564" class="label" font-weight="700">
    Recommendation
    <tspan dx="4" class="required">*</tspan>
  </text>
  <rect x="30" y="574" width="16" height="16" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" rx="3"/>
  <text x="52" y="586" class="label" font-size="13">Strong hire</text>
  <rect x="145" y="574" width="16" height="16" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" rx="3"/>
  <text x="167" y="586" class="label" font-size="13">Hire</text>
  <rect x="230" y="574" width="16" height="16" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" rx="3"/>
  <text x="252" y="586" class="label" font-size="13">Do not proceed</text>
</svg>
