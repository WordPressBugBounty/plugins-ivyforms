<svg viewBox="0 0 400 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #374151; }
      .label { font-size: 14px; font-weight: 700; }
      .title { font-size: 24px; font-weight: bold; }
      .option { font-size: 13px; }
      .placeholder { fill: #9ca3af; }
    </style>
    <g id="star-outline">
      <path d="M9.15316 5.40838C10.4198 3.13613 11.0531 2 12 2C12.9469 2 13.5802 3.13612 14.8468 5.40837L15.1745 5.99623C15.5345 6.64193 15.7144 6.96479 15.9951 7.17781C16.2757 7.39083 16.6251 7.4699 17.3241 7.62805L17.9605 7.77203C20.4201 8.32856 21.65 8.60682 21.9426 9.54773C22.2352 10.4886 21.3968 11.4691 19.7199 13.4299L19.2861 13.9372C18.8096 14.4944 18.5713 14.773 18.4641 15.1177C18.357 15.4624 18.393 15.8341 18.465 16.5776L18.5306 17.2544C18.7841 19.8706 18.9109 21.1787 18.1449 21.7602C17.3788 22.3417 16.2273 21.8115 13.9243 20.7512L13.3285 20.4768C12.6741 20.1755 12.3469 20.0248 12 20.0248C11.6531 20.0248 11.3259 20.1755 10.6715 20.4768L10.0757 20.7512C7.77268 21.8115 6.62118 22.3417 5.85515 21.7602C5.08912 21.1787 5.21588 19.8706 5.4694 17.2544L5.53498 16.5776C5.60703 15.8341 5.64305 15.4624 5.53586 15.1177C5.42868 14.773 5.19043 14.4944 4.71392 13.9372L4.2801 13.4299C2.60325 11.4691 1.76482 10.4886 2.05742 9.54773C2.35002 8.60682 3.57986 8.32856 6.03954 7.77203L6.67589 7.62805C7.37485 7.4699 7.72433 7.39083 8.00494 7.17781C8.28555 6.96479 8.46553 6.64194 8.82547 5.99623L9.15316 5.40838Z" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
    </g>
  </defs>

  <!-- White background -->
  <rect width="400" height="550" fill="#ffffff"/>

  <!-- Title (two lines) -->
  <text x="30" y="35" class="title">Ongoing client</text>
  <text x="30" y="60" class="title">feedback form</text>

  <!-- 1. Radio: Length of collaboration -->
  <text x="30" y="100" class="label">Length of collaboration</text>
  <circle cx="38" cy="122" r="7" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="53" y="127" class="option">Less than 3 months</text>

  <circle cx="38" cy="144" r="7" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="53" y="149" class="option">3–6 months</text>

  <circle cx="38" cy="166" r="7" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="53" y="171" class="option">6–12 months</text>

  <circle cx="38" cy="188" r="7" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="53" y="193" class="option">More than 1 year</text>

  <!-- 2. Rating: Overall satisfaction -->
  <text x="30" y="220" class="label">Overall satisfaction</text>
  <g transform="translate(30, 230)">
    <use href="#star-outline" x="0" y="10" width="22" height="22"/>
    <use href="#star-outline" x="30" y="10" width="22" height="22"/>
    <use href="#star-outline" x="60" y="10" width="22" height="22"/>
    <use href="#star-outline" x="90" y="10" width="22" height="22"/>
    <use href="#star-outline" x="120" y="10" width="22" height="22"/>
  </g>

  <!-- 3. Rating: Communication & responsiveness -->
  <text x="30" y="290" class="label">Communication &amp; responsiveness</text>
  <g transform="translate(30, 300)">
    <use href="#star-outline" x="0" y="10" width="22" height="22"/>
    <use href="#star-outline" x="30" y="10" width="22" height="22"/>
    <use href="#star-outline" x="60" y="10" width="22" height="22"/>
    <use href="#star-outline" x="90" y="10" width="22" height="22"/>
    <use href="#star-outline" x="120" y="10" width="22" height="22"/>
  </g>

  <!-- 4. Checkbox: Services used -->
  <text x="30" y="360" class="label">Services used</text>
  <rect x="30" y="370" width="16" height="16" rx="3" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="53" y="382" class="option">Strategy &amp; planning</text>

  <rect x="30" y="393" width="16" height="16" rx="3" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="53" y="405" class="option">Ongoing support</text>

  <rect x="30" y="416" width="16" height="16" rx="3" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="53" y="428" class="option">Maintenance</text>

  <!-- 5. Paragraph: Suggestions for improvement -->
  <text x="30" y="460" class="label">Suggestions for improvement</text>
  <rect x="30" y="470" width="340" height="20" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="38" y="484" class="option placeholder">Share any suggestions for improvement</text>

  <!-- 6. Phone: Phone number -->
  <text x="30" y="520" class="label">Phone number</text>
  <text x="30" y="533" class="option placeholder">Only if you prefer phone follow-up</text>


</svg>
