  <circle cx="42" cy="682" r="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="58" y="686" font-family="Arial, sans-serif" font-size="13" fill="#374151">No</text>

  <rect x="30" y="718" width="14" height="14" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="2"/>
  <text x="52" y="730" font-family="Arial, sans-serif" font-size="13" fill="#374151">Cancellation policy agreement<tspan dx="4" fill="#dc2626">*</tspan></text>
