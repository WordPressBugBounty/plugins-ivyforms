<svg viewBox="0 0 400 555" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title{fill:#111827;font-weight:700;font-size:24px;font-family:Arial,Helvetica,sans-serif}
      .label{fill:#374151;font-weight:700;font-size:12px;font-family:Arial,Helvetica,sans-serif}
      .placeholder{fill:#9ca3af;font-size:12px;font-family:Arial,Helvetica,sans-serif}
      .option{fill:#374151;font-size:12px;font-family:Arial,Helvetica,sans-serif}
      .input{fill:#f9fafb;stroke:#d1d5db;stroke-width:1.5}
      .required{fill:#dc2626;font-size:12px;font-family:Arial,Helvetica,sans-serif}
    </style>
    <g id="star-outline">
      <path d="M9.15316 5.40838C10.4198 3.13613 11.0531 2 12 2C12.9469 2 13.5802 3.13612 14.8468 5.40837L15.1745 5.99623C15.5345 6.64193 15.7144 6.96479 15.9951 7.17781C16.2757 7.39083 16.6251 7.4699 17.3241 7.62805L17.9605 7.77203C20.4201 8.32856 21.65 8.60682 21.9426 9.54773C22.2352 10.4886 21.3968 11.4691 19.7199 13.4299L19.2861 13.9372C18.8096 14.4944 18.5713 14.773 18.4641 15.1177C18.357 15.4624 18.393 15.8341 18.465 16.5776L18.5306 17.2544C18.7841 19.8706 18.9109 21.1787 18.1449 21.7602C17.3788 22.3417 16.2273 21.8115 13.9243 20.7512L13.3285 20.4768C12.6741 20.1755 12.3469 20.0248 12 20.0248C11.6531 20.0248 11.3259 20.1755 10.6715 20.4768L10.0757 20.7512C7.77268 21.8115 6.62118 22.3417 5.85515 21.7602C5.08912 21.1787 5.21588 19.8706 5.4694 17.2544L5.53498 16.5776C5.60703 15.8341 5.64305 15.4624 5.53586 15.1177C5.42868 14.773 5.19043 14.4944 4.71392 13.9372L4.2801 13.4299C2.60325 11.4691 1.76482 10.4886 2.05742 9.54773C2.35002 8.60682 3.57986 8.32856 6.03954 7.77203L6.67589 7.62805C7.37485 7.4699 7.72433 7.39083 8.00494 7.17781C8.28555 6.96479 8.46553 6.64194 8.82547 5.99623L9.15316 5.40838Z" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
    </g>
  </defs>

  <!-- White background -->
  <rect width="400" height="550" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="35" class="title">Product feedback form</text>

  <!-- Product name dropdown (required) -->
  <text x="30" y="75" class="label">Product name<tspan dx="4" class="required">*</tspan></text>
  <rect x="30" y="83" width="340" height="36" rx="6" class="input"/>
  <text x="40" y="108" class="placeholder">Select product…</text>
  <!-- Dropdown arrow -->
  <path d="M355 95 L360 100 L365 95" stroke="#9ca3af" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Issues experienced checkboxes (optional) -->
  <text x="30" y="147" class="label">Issues experienced</text>
  <!-- checkbox 1 -->
  <rect x="30" y="155" width="16" height="16" rx="3" stroke="#d1d5db" stroke-width="1.5" fill="#ffffff"/>
  <text x="56" y="168" class="option">Difficult to use</text>
  <!-- checkbox 2 -->
  <rect x="30" y="181" width="16" height="16" rx="3" stroke="#d1d5db" stroke-width="1.5" fill="#ffffff"/>
  <text x="56" y="194" class="option">Missing features</text>
  <!-- checkbox 3 -->
  <rect x="30" y="207" width="16" height="16" rx="3" stroke="#d1d5db" stroke-width="1.5" fill="#ffffff"/>
  <text x="56" y="220" class="option">Performance issues</text>
  <!-- checkbox 4 -->
  <rect x="30" y="233" width="16" height="16" rx="3" stroke="#d1d5db" stroke-width="1.5" fill="#ffffff"/>
  <text x="56" y="246" class="option">Quality concerns</text>
  <!-- checkbox 5 -->
  <rect x="30" y="259" width="16" height="16" rx="3" stroke="#d1d5db" stroke-width="1.5" fill="#ffffff"/>
  <text x="56" y="272" class="option">No issues</text>

  <!-- Product quality rating (required) -->
  <text x="30" y="307" class="label">Product quality<tspan dx="4" class="required">*</tspan></text>
  <g transform="translate(30, 317)">
    <use href="#star-outline" x="0" y="5" width="24" height="24"/>
    <use href="#star-outline" x="30" y="5" width="24" height="24"/>
    <use href="#star-outline" x="60" y="5" width="24" height="24"/>
    <use href="#star-outline" x="90" y="5" width="24" height="24"/>
    <use href="#star-outline" x="120" y="5" width="24" height="24"/>
  </g>

  <!-- Value for money rating (required) -->
  <text x="30" y="357" class="label">Value for money<tspan dx="4" class="required">*</tspan></text>
  <g transform="translate(30, 367)">
    <use href="#star-outline" x="0" y="5" width="24" height="24"/>
    <use href="#star-outline" x="30" y="5" width="24" height="24"/>
    <use href="#star-outline" x="60" y="5" width="24" height="24"/>
    <use href="#star-outline" x="90" y="5" width="24" height="24"/>
    <use href="#star-outline" x="120" y="5" width="24" height="24"/>
  </g>

  <!-- What did you like the most? textarea -->
  <text x="30" y="411" class="label">What did you like the most?</text>
  <rect x="30" y="419" width="340" height="50" rx="6" class="input"/>
  <text x="40" y="439" class="placeholder">Features, performance, design…</text>

  <!-- What can be improved? textarea -->
  <text x="30" y="497" class="label">What can be improved?</text>
  <rect x="30" y="505" width="340" height="36" rx="6" class="input"/>

</svg>
