<svg viewBox="0 0 400 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #374151; }
      .label { font-size: 14px; font-weight: 700; }
      .title { font-size: 24px; font-weight: bold; }
      .option { font-size: 13px; }
      .placeholder { fill: #9ca3af; }
    </style>
    <g id="star-outline">
      <path d="M12 2L14.5 9.5H22L16 14.5L18.5 22L12 17L5.5 22L8 14.5L2 9.5H9.5L12 2Z" stroke="#d1d5db" stroke-width="1.5" fill="#ffffff"/>
    </g>
  </defs>

  <!-- White background -->
  <rect width="400" height="550" fill="#ffffff"/>

  <!-- Title (2 lines) -->
  <text x="30" y="35" class="title">Service-specific</text>
  <text x="30" y="60" class="title">client feedback form</text>

  <!-- Field 1: Service received (Dropdown) -->
  <text x="30" y="100" class="label">Service received</text>
  <rect x="30" y="110" width="340" height="36" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="38" y="132" class="option placeholder">Select service</text>
  <polygon points="355,125 360,130 365,125" fill="#6b7280"/>

  <!-- Field 2: Did this service meet your needs? (Radio) -->
  <text x="30" y="180" class="label">Did this service meet your needs?</text>
  <circle cx="38" cy="198" r="7" stroke="#d1d5db" stroke-width="1.5" fill="#ffffff"/>
  <text x="53" y="203" class="option">Fully</text>
  <circle cx="38" cy="221" r="7" stroke="#d1d5db" stroke-width="1.5" fill="#ffffff"/>
  <text x="53" y="226" class="option">Mostly</text>
  <circle cx="38" cy="244" r="7" stroke="#d1d5db" stroke-width="1.5" fill="#ffffff"/>
  <text x="53" y="249" class="option">Partially</text>
  <circle cx="38" cy="267" r="7" stroke="#d1d5db" stroke-width="1.5" fill="#ffffff"/>
  <text x="53" y="272" class="option">Not at all</text>

  <!-- Field 3: Service quality (Rating) -->
  <text x="30" y="310" class="label">Service quality</text>
  <g transform="translate(30, 320)">
    <use href="#star-outline" x="0" y="10" width="24" height="24"/>
    <use href="#star-outline" x="30" y="10" width="24" height="24"/>
    <use href="#star-outline" x="60" y="10" width="24" height="24"/>
    <use href="#star-outline" x="90" y="10" width="24" height="24"/>
    <use href="#star-outline" x="120" y="10" width="24" height="24"/>
  </g>

  <!-- Field 4: Value for money (Rating) -->
  <text x="30" y="385" class="label">Value for money</text>
  <g transform="translate(30, 395)">
    <use href="#star-outline" x="0" y="10" width="24" height="24"/>
    <use href="#star-outline" x="30" y="10" width="24" height="24"/>
    <use href="#star-outline" x="60" y="10" width="24" height="24"/>
    <use href="#star-outline" x="90" y="10" width="24" height="24"/>
    <use href="#star-outline" x="120" y="10" width="24" height="24"/>
  </g>

  <!-- Field 5: Strengths of this service (Checkbox) -->
  <text x="30" y="460" class="label">Strengths of this service</text>
  <rect x="30" y="470" width="16" height="16" rx="3" stroke="#d1d5db" stroke-width="1.5" fill="#ffffff"/>
  <text x="53" y="482" class="option">Expertise</text>
  <rect x="30" y="493" width="16" height="16" rx="3" stroke="#d1d5db" stroke-width="1.5" fill="#ffffff"/>
  <text x="53" y="505" class="option">Communication</text>
  <rect x="30" y="516" width="16" height="16" rx="3" stroke="#d1d5db" stroke-width="1.5" fill="#ffffff"/>
  <text x="53" y="528" class="option">Speed</text>
</svg>
