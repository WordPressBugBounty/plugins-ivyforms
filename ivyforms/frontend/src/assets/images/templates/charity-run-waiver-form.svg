<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 655" width="400" height="655">
    <!-- Background -->
    <rect width="400" height="650" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" rx="8"/>

    <!-- Title -->
    <text x="30" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#374151">Charity run waiver</text>
    <text x="30" y="60" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#374151">form</text>

    <!-- Full Name header -->
    <text x="30" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#374151">Full name</text>

    <!-- First Name label -->
    <text x="30" y="118" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">First name<tspan dx="4" fill="#dc2626">*</tspan></text>
    <rect x="30" y="128" width="160" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="151" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter your first name</text>

    <!-- Last Name label -->
    <text x="210" y="118" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Last name<tspan dx="4" fill="#dc2626">*</tspan></text>
    <rect x="210" y="128" width="160" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="220" y="151" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter your last name</text>

    <!-- Email Address -->
    <text x="30" y="198" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Email address</text>
    <rect x="30" y="208" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="231" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter your email address</text>

    <!-- Phone Number -->
    <text x="30" y="278" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Phone number</text>
    <rect x="30" y="288" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="311" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">+1 (_) _-_</text>

    <!-- Run Type -->
    <text x="30" y="358" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Run type<tspan dx="4" fill="#dc2626">*</tspan></text>
    <rect x="30" y="368" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="391" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Select event distance</text>
    <path d="M 340 385 L 345 390 L 350 385" stroke="#9ca3af" fill="none" stroke-width="2"/>

    <!-- Emergency Contact Name -->
    <text x="30" y="438" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Emergency contact name<tspan dx="4" fill="#dc2626">*</tspan></text>
    <rect x="30" y="448" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="471" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter emergency contact name</text>

    <!-- Medical Conditions -->
    <text x="30" y="518" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Medical conditions</text>
    <rect x="30" y="528" width="340" height="60" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="551" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">List any medical conditions, allergies, or</text>
    <text x="40" y="571" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">medications...</text>

    <!-- Liability Waiver Checkbox -->
    <rect x="30" y="608" width="18" height="18" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="3"/>
    <text x="58" y="622" font-family="Arial, sans-serif" font-size="13" fill="#374151">I acknowledge the risks and release liability<tspan dx="4" fill="#dc2626">*</tspan></text>

    <!-- Signature -->
    <text x="30" y="658" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Signature<tspan dx="4" fill="#dc2626">*</tspan></text>
</svg>
