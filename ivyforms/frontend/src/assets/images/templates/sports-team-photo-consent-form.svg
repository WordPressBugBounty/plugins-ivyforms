<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1725" width="400" height="1725">
    <!-- Background -->
    <rect width="400" height="1725" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" rx="8"/>

    <!-- Title -->
    <text x="30" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#374151">Sports team photo consent</text>
    <text x="30" y="60" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#374151">form</text>

    <!-- Personal Information Section -->
    <text x="30" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#374151">Personal information</text>

    <!-- First Name label -->
    <text x="30" y="118" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">First name <tspan dx="4" fill="#dc2626">*</tspan></text>
    <rect x="30" y="128" width="160" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="151" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter first name</text>

    <!-- Last Name label -->
    <text x="210" y="118" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Last name <tspan dx="4" fill="#dc2626">*</tspan></text>
    <rect x="210" y="128" width="160" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="220" y="151" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter last name</text>

    <!-- Age -->
    <text x="30" y="198" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Age <tspan dx="4" fill="#dc2626">*</tspan></text>
    <rect x="30" y="208" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="231" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter age</text>

    <!-- Team / Club Name -->
    <text x="30" y="278" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Team / club name <tspan dx="4" fill="#dc2626">*</tspan></text>
    <rect x="30" y="288" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="311" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter team or club name</text>

    <!-- Sport / Activity -->
    <text x="30" y="358" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Sport / activity <tspan dx="4" fill="#dc2626">*</tspan></text>
    <rect x="30" y="368" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="391" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Select activity</text>

    <!-- Email Address -->
    <text x="30" y="518" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Email address</text>
    <rect x="30" y="528" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="551" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter your email address</text>

    <!-- Phone Number -->
    <text x="30" y="598" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Phone number</text>
    <rect x="30" y="608" width="160" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="631" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">+1 (_) _-_</text>

    <!-- Guardian / Parent Information Section -->
    <text x="30" y="678" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#374151">Parent / guardian information</text>

    <!-- Parent / Guardian Name -->
    <text x="30" y="698" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Parent / guardian name <tspan dx="4" fill="#dc2626">*</tspan></text>
    <rect x="30" y="708" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="731" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter parent or guardian name</text>

    <!-- Relationship to Participant -->
    <text x="30" y="778" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Relationship to participant <tspan dx="4" fill="#dc2626">*</tspan></text>
    <rect x="30" y="788" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="811" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Select relationship</text>
    <text x="40" y="837" font-family="Arial, sans-serif" font-size="14" fill="#374151">• Mother</text>
    <text x="40" y="853" font-family="Arial, sans-serif" font-size="14" fill="#374151">• Father</text>
    <text x="40" y="869" font-family="Arial, sans-serif" font-size="14" fill="#374151">• Guardian</text>
    <text x="40" y="885" font-family="Arial, sans-serif" font-size="14" fill="#374151">• Other</text>

    <!-- Parent / Guardian Contact Number -->
    <text x="30" y="925" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Parent / guardian contact number <tspan dx="4" fill="#dc2626">*</tspan></text>
    <rect x="30" y="935" width="160" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="958" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">+1 (_) _-_</text>

    <!-- Parent / Guardian Email -->
    <text x="30" y="998" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Parent / guardian email</text>
    <rect x="30" y="1008" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="1031" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter parent or guardian email</text>

    <!-- Event Details Section (shifted) -->
    <text x="30" y="1068" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#374151">Event / team details</text>

    <!-- Season / Year -->
    <text x="30" y="1086" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Season / year <tspan dx="4" fill="#dc2626">*</tspan></text>
    <rect x="30" y="1096" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="1119" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter season / year</text>

    <!-- League / Tournament Name -->
    <text x="30" y="1166" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">League / tournament name</text>
    <rect x="30" y="1176" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="1199" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter league or tournament name</text>

    <!-- Coach / Team Manager Name -->
    <text x="30" y="1236" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Coach / team manager name</text>
    <rect x="30" y="1246" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="1269" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter coach or team manager name</text>

    <!-- Consent Section (shifted) -->
    <text x="30" y="1316" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#374151">Consent</text>

    <!-- Consent Statement -->
    <rect x="30" y="1330" width="18" height="18" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="3"/>
    <text x="55" y="1343" font-family="Arial, sans-serif" font-size="14" fill="#374151">I hereby grant permission for my photo and video to be taken during team events, practices, or matches</text>

    <!-- Usage Rights -->
    <rect x="30" y="1365" width="18" height="18" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="3"/>
    <text x="55" y="1378" font-family="Arial, sans-serif" font-size="14" fill="#374151">I grant the organization the right to use, reproduce, and distribute photos/videos for team communications and promotions</text>

    <!-- Modification Rights -->
    <rect x="30" y="1398" width="18" height="18" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="3"/>
    <text x="55" y="1411" font-family="Arial, sans-serif" font-size="14" fill="#374151">I grant permission to edit, crop, or modify images or videos as necessary</text>

    <!-- Waiver / Release -->
    <rect x="30" y="1431" width="18" height="18" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="3"/>
    <text x="55" y="1444" font-family="Arial, sans-serif" font-size="14" fill="#374151">I release the organization from any claims related to the use of these photos or videos</text>

    <!-- Duration of Consent -->
    <text x="30" y="1474" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Duration of consent <tspan dx="4" fill="#dc2626">*</tspan></text>
    <rect x="30" y="1484" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="1507" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">This consent is valid for [specify duration or indefinitely]</text>

    <!-- Consent Withdrawal Instructions -->
    <text x="30" y="1537" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Consent withdrawal instructions</text>
    <rect x="30" y="1547" width="340" height="60" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="1571" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Consent can be withdrawn at any time by contacting [email address / team contact]</text>

    <!-- Special Instructions / Notes -->
    <text x="30" y="1621" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Special instructions / notes</text>
    <rect x="30" y="1631" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="1654" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter comments</text>

    <!-- Acknowledgment of Questions Answered / Signatures -->
    <rect x="30" y="1685" width="18" height="18" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="3"/>
    <text x="55" y="1698" font-family="Arial, sans-serif" font-size="14" fill="#374151">I have had the opportunity to ask questions and they have been answered</text>
    <text x="30" y="1718" font-family="Arial, sans-serif" font-size="14" fill="#374151">Participant signature ____________________  date ________</text>

    <!-- Submit Button (visual hint) -->
    <rect x="30" y="1725" width="340" height="44" fill="#4f46e5" rx="6"/>
    <text x="200" y="1752" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Submit consent</text>
</svg>
