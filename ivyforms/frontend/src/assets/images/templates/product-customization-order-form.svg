<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 850" width="400" height="850">
  <!-- Background -->
  <rect width="400" height="850" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" rx="8"/>

  <!-- Title -->
  <text x="30" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#374151">Product</text>
  <text x="30" y="60" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#374151">customization form</text>

  <!-- Multi-page progress bar -->
  <rect x="30" y="78" width="340" height="6" fill="#e5e7eb" rx="3"/>
  <rect x="30" y="78" width="68" height="6" fill="#374151" rx="3"/>
  <line x1="98" y1="78" x2="98" y2="84" stroke="#d1d5db" stroke-width="1"/>
  <line x1="166" y1="78" x2="166" y2="84" stroke="#d1d5db" stroke-width="1"/>
  <line x1="234" y1="78" x2="234" y2="84" stroke="#d1d5db" stroke-width="1"/>
  <line x1="302" y1="78" x2="302" y2="84" stroke="#d1d5db" stroke-width="1"/>
  <text x="30" y="100" font-family="Arial, sans-serif" font-size="11" fill="#374151">Page 1 - 20%</text>

  <!-- Full name -->
  <text x="30" y="128" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#374151">Full name</text>
  <text x="30" y="146" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">First name<tspan dx="4" fill="#dc2626">*</tspan></text>
  <rect x="30" y="156" width="160" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="40" y="179" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter your first name</text>
  <text x="210" y="146" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Last name<tspan dx="4" fill="#dc2626">*</tspan></text>
  <rect x="210" y="156" width="160" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="220" y="179" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter your last name</text>

  <!-- Email address -->
  <text x="30" y="226" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Email address<tspan dx="4" fill="#dc2626">*</tspan></text>
  <rect x="30" y="236" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="40" y="259" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">name@example.com</text>

  <!-- Phone number -->
  <text x="30" y="306" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Phone number<tspan dx="4" fill="#dc2626">*</tspan></text>
  <rect x="30" y="316" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="40" y="339" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">+1 (_) _-_</text>

  <!-- Company name -->
  <text x="30" y="386" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Company name</text>
  <rect x="30" y="396" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="40" y="419" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter company name</text>

  <!-- Website -->
  <text x="30" y="466" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Website</text>
  <rect x="30" y="476" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="40" y="499" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">https://example.com</text>

  <!-- Product type -->
  <text x="30" y="546" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Product type<tspan dx="4" fill="#dc2626">*</tspan></text>
  <rect x="30" y="556" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="40" y="579" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Select product type</text>
  <path d="M345 574 L350 579 L355 574" stroke="#9ca3af" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Product idea description -->
  <text x="30" y="626" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Product idea description<tspan dx="4" fill="#dc2626">*</tspan></text>
  <rect x="30" y="636" width="340" height="56" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="40" y="660" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Describe your product idea</text>

  <!-- Estimated quantity -->
  <text x="30" y="712" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Estimated quantity<tspan dx="4" fill="#dc2626">*</tspan></text>
  <rect x="30" y="722" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="40" y="745" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter estimated quantity</text>

  <!-- Production timeline -->
  <text x="30" y="792" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Production timeline<tspan dx="4" fill="#dc2626">*</tspan></text>
  <circle cx="42" cy="818" r="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="58" y="822" font-family="Arial, sans-serif" font-size="13" fill="#374151">Standard (2-3 weeks)</text>
</svg>
