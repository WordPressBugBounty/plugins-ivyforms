<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1175" width="400" height="1175">
  <!-- Background -->
  <rect width="400" height="1150" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" rx="8"/>

  <!-- Title -->
  <text x="30" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#374151">Blood transfusion consent</text>
  <text x="30" y="60" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#374151">form</text>

  <!-- Patient Information Section -->
  <text x="30" y="100" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#374151">Patient information</text>

  <!-- First Name and Last Name -->
  <text x="30" y="128" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">First name<tspan dx="4" fill="#dc2626">*</tspan></text>
  <rect x="30" y="138" width="160" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="40" y="161" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter first name</text>

  <text x="210" y="128" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Last name<tspan dx="4" fill="#dc2626">*</tspan></text>
  <rect x="210" y="138" width="160" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="220" y="161" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter last name</text>

  <!-- Age -->
  <text x="30" y="208" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Age<tspan dx="4" fill="#dc2626">*</tspan></text>
  <rect x="30" y="218" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="200" y="241" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af" text-anchor="middle">Enter age</text>
  <!-- Minus button -->
  <line x1="40" y1="238" x2="52" y2="238" stroke="#9ca3af" stroke-width="2"/>
  <!-- Plus button -->
  <line x1="348" y1="238" x2="360" y2="238" stroke="#9ca3af" stroke-width="2"/>
  <line x1="354" y1="232" x2="354" y2="244" stroke="#9ca3af" stroke-width="2"/>

  <!-- Patient ID -->
  <text x="30" y="288" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Patient ID/medical record number<tspan dx="4" fill="#dc2626">*</tspan></text>
  <rect x="30" y="298" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="40" y="321" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter patient ID</text>

  <!-- Blood Type -->
  <text x="30" y="368" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Blood type<tspan dx="4" fill="#dc2626">*</tspan></text>
  <rect x="30" y="378" width="160" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="40" y="401" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Select blood type</text>
  <polygon points="170,398 182,398 176,405" fill="#9ca3af"/>

  <!-- Contact Number -->
  <text x="210" y="368" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Contact number<tspan dx="4" fill="#dc2626">*</tspan></text>
  <rect x="210" y="378" width="160" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="220" y="401" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">+1 (_) _-_</text>

  <!-- Transfusion Details Section -->
  <text x="30" y="448" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#374151">Transfusion details</text>

  <!-- Reason for Transfusion -->
  <text x="30" y="478" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Reason for transfusion<tspan dx="4" fill="#dc2626">*</tspan></text>
  <rect x="30" y="488" width="340" height="60" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="40" y="511" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Describe medical reason</text>

  <!-- Blood Product Type -->
  <text x="30" y="578" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Blood product type<tspan dx="4" fill="#dc2626">*</tspan></text>
  <rect x="30" y="588" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="40" y="611" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Select product type</text>
  <polygon points="350,608 362,608 356,615" fill="#9ca3af"/>

  <!-- Ordering Physician -->
  <text x="30" y="658" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Ordering physician name<tspan dx="4" fill="#dc2626">*</tspan></text>
  <rect x="30" y="668" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="40" y="691" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter physician name</text>

  <!-- Scheduled Transfusion Date -->
  <text x="30" y="738" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Scheduled transfusion date<tspan dx="4" fill="#dc2626">*</tspan></text>
  <rect x="30" y="748" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="40" y="771" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Select date</text>
  <!-- Calendar icon -->
  <rect x="336" y="758" width="20" height="20" rx="2" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="341" y1="756" x2="341" y2="761" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="351" y1="756" x2="351" y2="761" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- Medical History Section -->
  <text x="30" y="818" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#374151">Medical history</text>

  <!-- Previous Transfusions -->
  <text x="30" y="848" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Previous transfusions</text>
  <rect x="30" y="863" width="18" height="18" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" rx="3"/>
  <text x="53" y="876" font-family="Arial, sans-serif" font-size="13" fill="#374151">Yes, i have received blood transfusions before</text>

  <!-- Transfusion Reactions -->
  <text x="30" y="908" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Previous transfusion reactions</text>
  <rect x="30" y="918" width="340" height="60" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="40" y="941" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Describe any past reactions</text>

  <!-- Known Allergies -->
  <text x="30" y="1008" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Known allergies<tspan dx="4" fill="#dc2626">*</tspan></text>
  <rect x="30" y="1018" width="340" height="60" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="40" y="1041" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">List any known allergies</text>

  <!-- Consent Section -->
  <text x="30" y="1108" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Consent<tspan dx="4" fill="#dc2626">*</tspan></text>
  <rect x="30" y="1123" width="18" height="18" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" rx="3"/>
  <text x="53" y="1136" font-family="Arial, sans-serif" font-size="12" fill="#374151">I consent to receive blood transfusion and acknowledge risks</text>

  <!-- Submit Button -->
  <rect x="30" y="1150" width="120" height="20" fill="#3b82f6" rx="4"/>
  <text x="90" y="1165" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">Submit</text>
</svg>