<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 705" width="400" height="705">
  <!-- Background -->
  <rect width="400" height="700" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" rx="8"/>

  <!-- Title -->
  <text x="30" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#374151">Birthday t-shirt order form</text>

  <!-- Orderer Name header -->
  <text x="30" y="75" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#374151">Orderer name<tspan dx="4" fill="#dc2626">*</tspan></text>

  <!-- First Name label -->
  <text x="30" y="93" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">First name<tspan dx="4" fill="#dc2626">*</tspan></text>
  <rect x="30" y="103" width="160" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="40" y="126" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter your first name</text>

  <!-- Last Name label -->
  <text x="210" y="93" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Last name<tspan dx="4" fill="#dc2626">*</tspan></text>
  <rect x="210" y="103" width="160" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="220" y="126" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter your last name</text>

  <!-- Email Address -->
  <text x="30" y="168" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Email address<tspan dx="4" fill="#dc2626">*</tspan></text>
  <rect x="30" y="178" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="40" y="201" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">name@example.com</text>

  <!-- Phone Number -->
  <text x="30" y="243" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Phone number</text>
  <rect x="30" y="253" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="40" y="276" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">+1 (_) _-_</text>

  <!-- Birthday Person's Name -->
  <text x="30" y="318" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Birthday person's name<tspan dx="4" fill="#dc2626">*</tspan></text>
  <rect x="30" y="328" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="40" y="351" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter birthday person's name</text>

  <!-- T-shirt Size -->
  <text x="30" y="393" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">T-shirt size<tspan dx="4" fill="#dc2626">*</tspan></text>
  <rect x="30" y="403" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="40" y="426" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Select t-shirt size</text>
  <polygon points="322,416 334,416 328,426" fill="#9ca3af" />

  <!-- Quantity -->
  <text x="30" y="468" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Quantity<tspan dx="4" fill="#dc2626">*</tspan></text>
  <rect x="30" y="478" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="40" y="501" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter quantity</text>

  <!-- Message or Design Notes -->
  <text x="30" y="543" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Message or design notes</text>
  <rect x="30" y="553" width="340" height="50" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="40" y="576" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Add birthday message or design details</text>

  <!-- T-shirt Color -->
  <text x="30" y="628" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">T-shirt color<tspan dx="4" fill="#dc2626">*</tspan></text>
  <rect x="30" y="638" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="40" y="661" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Select t-shirt color</text>
  <polygon points="322,651 334,651 328,661" fill="#9ca3af" />
</svg>
