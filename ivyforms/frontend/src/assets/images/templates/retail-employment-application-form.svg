<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 625" width="400" height="625">
  <rect width="400" height="620" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" rx="8"/>
  <text x="30" y="28" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#374151">Retail employment</text>
  <text x="30" y="52" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#374151">application form</text>
  <text x="30" y="90" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#374151">Name<tspan dx="4" fill="#dc2626">*</tspan></text>
  <text x="30" y="108" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">First name<tspan dx="4" fill="#dc2626">*</tspan></text>
  <rect x="30" y="118" width="160" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
