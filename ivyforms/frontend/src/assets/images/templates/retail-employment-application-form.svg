  <text x="210" y="108" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Last name<tspan dx="4" fill="#dc2626">*</tspan></text>
  <rect x="210" y="118" width="160" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="220" y="141" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter your last name</text>
  <text x="30" y="185" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Email address<tspan dx="4" fill="#dc2626">*</tspan></text>
  <rect x="30" y="195" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="40" y="220" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">name@example.com</text>
  <text x="30" y="255" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Availability (Days/Hours)<tspan dx="4" fill="#dc2626">*</tspan></text>
  <rect x="30" y="265" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="40" y="290" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter availability (days/hours)</text>
  <text x="30" y="325" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Previous work experience<tspan dx="4" fill="#dc2626">*</tspan></text>
  <rect x="30" y="335" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="40" y="360" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter previous work experience</text>
  <text x="30" y="395" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">CV upload<tspan dx="4" fill="#dc2626">*</tspan></text>
  <rect x="30" y="405" width="340" height="55" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" stroke-dasharray="6 4" rx="6"/>
  <text x="200" y="437" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#9ca3af">Drag file here or click to upload</text>
  <text x="30" y="480" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Reference letter<tspan dx="4" fill="#dc2626">*</tspan></text>
