  <text x="40" y="515" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter reference letter</text>
  <text x="30" y="550" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Desired salary<tspan dx="4" fill="#dc2626">*</tspan></text>
  <rect x="30" y="560" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="40" y="585" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter desired salary</text>
