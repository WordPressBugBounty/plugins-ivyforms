  <text x="30" y="856" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Urgency level<tspan dx="4" fill="#dc2626">*</tspan></text>
  <circle cx="42" cy="884" r="9" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="58" y="888" font-family="Arial, sans-serif" font-size="14" fill="#374151">Low</text>
  <circle cx="102" cy="884" r="9" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="118" y="888" font-family="Arial, sans-serif" font-size="14" fill="#374151">Medium</text>
