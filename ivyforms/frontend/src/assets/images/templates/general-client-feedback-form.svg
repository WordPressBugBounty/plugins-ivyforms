<svg viewBox="0 0 400 550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #374151; }
      .label { font-size: 14px; font-weight: 700; }
      .title { font-size: 24px; font-weight: bold; }
      .option { font-size: 13px; }
      .placeholder { fill: #9ca3af; }
      .description { font-size: 12px; fill: #6b7280; }
    </style>
    <g id="star-outline">
      <path d="M9.15316 5.40838C10.4198 3.13613 11.0531 2 12 2C12.9469 2 13.5802 3.13612 14.8468 5.40837L15.1745 5.99623C15.5345 6.64193 15.7144 6.96479 15.9951 7.17781C16.2757 7.39083 16.6251 7.4699 17.3241 7.62805L17.9605 7.77203C20.4201 8.32856 21.65 8.60682 21.9426 9.54773C22.2352 10.4886 21.3968 11.4691 19.7199 13.4299L19.2861 13.9372C18.8096 14.4944 18.5713 14.773 18.4641 15.1177C18.357 15.4624 18.393 15.8341 18.465 16.5776L18.5306 17.2544C18.7841 19.8706 18.9109 21.1787 18.1449 21.7602C17.3788 22.3417 16.2273 21.8115 13.9243 20.7512L13.3285 20.4768C12.6741 20.1755 12.3469 20.0248 12 20.0248C11.6531 20.0248 11.3259 20.1755 10.6715 20.4768L10.0757 20.7512C7.77268 21.8115 6.62118 22.3417 5.85515 21.7602C5.08912 21.1787 5.21588 19.8706 5.4694 17.2544L5.53498 16.5776C5.60703 15.8341 5.64305 15.4624 5.53586 15.1177C5.42868 14.773 5.19043 14.4944 4.71392 13.9372L4.2801 13.4299C2.60325 11.4691 1.76482 10.4886 2.05742 9.54773C2.35002 8.60682 3.57986 8.32856 6.03954 7.77203L6.67589 7.62805C7.37485 7.4699 7.72433 7.39083 8.00494 7.17781C8.28555 6.96479 8.46553 6.64194 8.82547 5.99623L9.15316 5.40838Z" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
    </g>
  </defs>

  <!-- White background -->
  <rect width="400" height="550" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="35" class="title">General client feedback form</text>

  <!-- Field 1: Type of engagement (Dropdown) -->
  <text x="30" y="75" class="label">Type of engagement</text>
  <rect x="30" y="85" width="340" height="36" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="38" y="107" class="option placeholder">Select engagement type</text>
  <polygon points="355,100 360,105 365,100" fill="#6b7280"/>

  <!-- Field 2: How would you describe the collaboration? (Rating) -->
  <text x="30" y="155" class="label">How would you describe the collaboration?</text>
  <g transform="translate(30, 165)">
    <use href="#star-outline" x="0" y="0" width="22" height="22"/>
    <use href="#star-outline" x="30" y="0" width="22" height="22"/>
    <use href="#star-outline" x="60" y="0" width="22" height="22"/>
    <use href="#star-outline" x="90" y="0" width="22" height="22"/>
  </g>

  <!-- Field 3: Overall client satisfaction (Rating) -->
  <text x="30" y="225" class="label">Overall client satisfaction</text>
  <g transform="translate(30, 235)">
    <use href="#star-outline" x="0" y="0" width="22" height="22"/>
    <use href="#star-outline" x="30" y="0" width="22" height="22"/>
    <use href="#star-outline" x="60" y="0" width="22" height="22"/>
    <use href="#star-outline" x="90" y="0" width="22" height="22"/>
    <use href="#star-outline" x="120" y="0" width="22" height="22"/>
  </g>

  <!-- Field 4: What areas stood out? (Checkbox) -->
  <text x="30" y="295" class="label">What areas stood out?</text>
  <rect x="30" y="305" width="16" height="16" rx="3" stroke="#d1d5db" stroke-width="1.5" fill="#ffffff"/>
  <text x="53" y="317" class="option">Communication</text>
  <rect x="30" y="328" width="16" height="16" rx="3" stroke="#d1d5db" stroke-width="1.5" fill="#ffffff"/>
  <text x="53" y="340" class="option">Expertise</text>
  <rect x="30" y="351" width="16" height="16" rx="3" stroke="#d1d5db" stroke-width="1.5" fill="#ffffff"/>
  <text x="53" y="363" class="option">Timeliness</text>

  <!-- Field 5: Additional feedback (Paragraph) -->
  <text x="30" y="400" class="label">Additional feedback</text>
  <rect x="30" y="410" width="340" height="20" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="38" y="424" class="option placeholder">Share any thoughts about working with us</text>

  <!-- Field 6: Email (Email field) -->
  <text x="30" y="460" class="label">Email</text>
  <text x="30" y="473" class="description">Leave your email if you'd like a follow-up</text>
</svg>
