<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1355" width="400" height="1355">
    <!-- Background -->
    <rect width="400" height="1350" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" rx="8"/>

    <!-- Title -->
    <text x="30" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#374151">Photo &amp; video</text>
    <text x="30" y="60" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#374151">consent form</text>

    <!-- Personal Information header -->
    <text x="30" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#374151">Personal information</text>

    <!-- Full Name label -->
    <text x="30" y="118" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Full name<tspan dx="4" fill="#dc2626">*</tspan></text>
    <rect x="30" y="128" width="160" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="151" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">First name</text>

    <!-- Last Name -->
    <text x="210" y="118" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Last name<tspan dx="4" fill="#dc2626">*</tspan></text>
    <rect x="210" y="128" width="160" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="220" y="151" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Last name</text>

    <!-- Phone Number -->
    <text x="30" y="198" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Phone number<tspan dx="4" fill="#dc2626">*</tspan></text>
    <rect x="30" y="208" width="160" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="231" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">+1 (___) ___-____</text>

    <!-- Email Address -->
    <text x="210" y="198" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Email address<tspan dx="4" fill="#dc2626">*</tspan></text>
    <rect x="210" y="208" width="160" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="220" y="231" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">email@example.com</text>

    <!-- Address (optional) -->
    <text x="30" y="278" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Address (optional)</text>
    <rect x="30" y="288" width="340" height="80" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="311" font-family="Arial, sans-serif" font-size="13" fill="#9ca3af">Street, city, state,</text>
    <text x="40" y="331" font-family="Arial, sans-serif" font-size="13" fill="#9ca3af">Postal code, country</text>
    <text x="40" y="351" font-family="Arial, sans-serif" font-size="13" fill="#9ca3af">(optional)</text>

    <!-- Consent & Authorization header -->
    <text x="30" y="398" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#374151">Consent and authorization</text>

    <!-- Photo & Video Consent -->
    <rect x="30" y="418" width="20" height="20" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" rx="4"/>
    <text x="60" y="433" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#374151">Photo/video consent<tspan dx="4" fill="#dc2626">*</tspan></text>
    <text x="60" y="452" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Grant permission for photos/videos</text>

    <!-- Age & Competency -->
    <rect x="30" y="473" width="20" height="20" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" rx="4"/>
    <text x="60" y="488" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#374151">Age and competency<tspan dx="4" fill="#dc2626">*</tspan></text>
    <text x="60" y="507" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">18+ years old and competent</text>

    <!-- Usage Rights -->
    <rect x="30" y="528" width="20" height="20" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" rx="4"/>
    <text x="60" y="543" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#374151">Usage rights<tspan dx="4" fill="#dc2626">*</tspan></text>
    <text x="60" y="562" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Right to use and distribute photos</text>

    <!-- Modification Rights -->
    <rect x="30" y="583" width="20" height="20" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" rx="4"/>
    <text x="60" y="598" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#374151">Modification rights</text>
    <text x="60" y="617" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Allow necessary modifications</text>

    <!-- Waiver & Release -->
    <rect x="30" y="638" width="20" height="20" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" rx="4"/>
    <text x="60" y="653" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#374151">Waiver statement<tspan dx="4" fill="#dc2626">*</tspan></text>
    <text x="60" y="672" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Release all rights and claims</text>

    <!-- Duration of Consent -->
    <text x="30" y="713" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Duration of consent</text>
    <rect x="30" y="723" width="340" height="50" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="746" font-family="Arial, sans-serif" font-size="13" fill="#9ca3af">Specify consent duration (optional)</text>

    <!-- Consent Withdrawal -->
    <text x="30" y="803" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Withdrawal instructions</text>
    <rect x="30" y="813" width="340" height="50" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="836" font-family="Arial, sans-serif" font-size="13" fill="#9ca3af">Contact info for withdrawal (optional)</text>

    <!-- Signatures header -->
    <text x="30" y="893" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#374151">Signatures</text>

    <!-- Participant / Model Signature -->
    <text x="30" y="911" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Participant signature<tspan dx="4" fill="#dc2626">*</tspan></text>
    <rect x="30" y="921" width="340" height="70" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="944" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Draw your signature here</text>
    <!-- Signature icon/line -->
    <path d="M 50 972 Q 100 962, 150 972 T 250 962 Q 290 957, 330 967" stroke="#d1d5db" fill="none" stroke-width="2" stroke-linecap="round"/>

    <!-- Date of Agreement -->
    <text x="30" y="1021" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Date of agreement<tspan dx="4" fill="#dc2626">*</tspan></text>
    <rect x="30" y="1031" width="340" height="40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="1054" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">MM/DD/YYYY</text>
    <!-- Calendar icon -->
    <rect x="345" y="1041" width="20" height="20" fill="none" stroke="#9ca3af" stroke-width="1.5" rx="2"/>
    <line x1="348" y1="1041" x2="348" y2="1046" stroke="#9ca3af" stroke-width="1.5"/>
    <line x1="362" y1="1041" x2="362" y2="1046" stroke="#9ca3af" stroke-width="1.5"/>
    <line x1="345" y1="1052" x2="365" y2="1052" stroke="#9ca3af" stroke-width="1.5"/>

    <!-- Special Instructions / Notes -->
    <text x="30" y="1101" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Special instructions / notes</text>
    <rect x="30" y="1111" width="340" height="60" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="40" y="1134" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">Enter any special instructions</text>
    <text x="40" y="1154" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">(optional)</text>

    <!-- Acknowledgment -->
    <rect x="30" y="1191" width="20" height="20" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" rx="4"/>
    <text x="60" y="1206" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#374151">Questions answered</text>
    <text x="60" y="1225" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">All questions answered to my satisfaction</text>

</svg>

